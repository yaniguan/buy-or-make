name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install package with test and hdf5 extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,hdf5]"
      - name: Lint with ruff
        run: ruff check buyormake scripts examples tests
      - name: Verify zero JSON Schema drift
        run: |
          buy-or-make export-schema --out schema
          git diff --exit-code schema/
      - name: Run pytest
        run: pytest -v
