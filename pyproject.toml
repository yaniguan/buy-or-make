[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buy-or-make"
version = "0.1.0"
description = "Check whether candidate molecules are purchasable or reachable in N steps from purchasable building blocks, with conservative cost estimates from listed prices only."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Yani Guan"},
]
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "ruff>=0.4",
]
hdf5 = [
    "h5py>=3.10",
]
data = [
    "py7zr>=0.21",
    "pyarrow>=15.0",
    "h5py>=3.10",
]
aizynthfinder = [
    "aizynthfinder>=4.0",
]
rascore = [
    "xgboost>=2.0",
]

[project.scripts]
buy-or-make = "buyormake.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["buyormake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["buyormake"]
